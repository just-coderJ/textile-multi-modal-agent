name: Deploy

om:
  push:
    branches: ["main"] # 只有推送main分支才触发

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 把代码拉到 Github 服务器上
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 编译前端
      - name: Build Frontend
        run: |
          cd textile-multi-modal-agent/frontend
          npm install
          npm run build
          # 把编译好的文件打个压缩包，方便传给服务器
          tar -czf ../frontend-dist.tar.gz ./dist

      # 3. 编译后端 (需要 Java 17 或 21)
      - name: Build Backend
        run: |
          cd textile-multi-modal-agent
          mvn clean package -DskipTests
          
      # 4. 把编译好的前、后端文件和 docker-compose.yml 传到服务器
      - name: Copy files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "frontend-dist.tar.gz,textile-multi-modal-agent/target/*.jar,docker-compose.yml"
          target: "/root/textile-agent/"

      # 5. 在服务器上执行解压、改名、构建镜像等收尾工作
      - name: Execute Deployment on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /root/textile-agent
            
            # 解压前端代码，覆盖旧文件
            tar -xzf frontend-dist.tar.gz -C ./frontend --strip-components=1
            
            # 把后端编译好的 jar 包，挪到后端的 build 目录
            mv textile-multi-modal-agent/target/*.jar ./backend/app.jar
            
            # 执行我们写好的启动脚本
            ./deploy.sh